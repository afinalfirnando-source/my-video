name: Render Single Video (100-250MB)

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "remotion.config.ts"
      - ".github/workflows/render-single-100-250mb.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (default: AuroraBorealis-Professional-1)"
        required: false
        default: "AuroraBorealis-Professional-1"
      codec:
        description: "Video codec"
        required: false
        default: "h264"
      crf:
        description: "Constant Rate Factor (quality). Lower = larger file."
        required: false
        default: "18"

env:
  TARGET_COMPOSITION: ${{ vars.RENDER_COMPOSITION || 'AuroraBorealis-Professional-1' }}

jobs:
  render:
    name: Render ${{ inputs.composition || env.TARGET_COMPOSITION }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Set composition variable
        id: vars
        run: |
          COMP="${{ inputs.composition }}"
          if [ -z "$COMP" ]; then COMP="${{ env.TARGET_COMPOSITION }}"; fi
          if [ -z "$COMP" ]; then COMP="AuroraBorealis-Professional-1"; fi
          echo "composition=$COMP" >> "$GITHUB_OUTPUT"
          echo "Rendering composition: $COMP"

      - name: Render video
        run: |
          COMP="${{ steps.vars.outputs.composition }}"
          CODEC="${{ inputs.codec || 'h264' }}"
          CRF="${{ inputs.crf || '18' }}"
          npx remotion render \
            "$COMP" \
            "out/${COMP}.mp4" \
            --codec="$CODEC" \
            --crf="$CRF" \
            --preset=fast \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Check file size (100-250 MB)
        run: |
          COMP="${{ steps.vars.outputs.composition }}"
          VIDEO="out/${COMP}.mp4"
          FILE_SIZE_BYTES=$(stat -c%s "$VIDEO")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          echo "File: $VIDEO"
          echo "File size: ${FILE_SIZE_MB} MB"
          if [ "$FILE_SIZE_MB" -lt 100 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is below 100 MB target"
            echo "NOTE: Reduce --crf (e.g. crf=15) for a larger file"
            exit 1
          elif [ "$FILE_SIZE_MB" -gt 250 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is above 250 MB target"
            echo "NOTE: Increase --crf (e.g. crf=23) for a smaller file"
            exit 1
          else
            echo "OK: File size ${FILE_SIZE_MB} MB is within 100-250 MB range"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.vars.outputs.composition }}-video"
          path: "out/${{ steps.vars.outputs.composition }}.mp4"
          retention-days: 14
        env:
          ACTIONS_RUNNER_DEBUG: 1

      - name: Report file details
        run: |
          COMP="${{ steps.vars.outputs.composition }}"
          ls -la "out/${COMP}.mp4"
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=noprint_wrappers=1 "out/${COMP}.mp4"
