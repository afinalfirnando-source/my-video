name: Render MirrorChrome

on:
  push:
    branches: [main, master]
    paths:
      - "src/templates/mirror-chrome/**"
      - "remotion.config.ts"
      - ".github/workflows/render-mirror-chrome.yml"
  workflow_dispatch:

jobs:
  render-mirror-chrome:
    name: Render MirrorChrome (100-250MB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Render MirrorChrome
        run: |
          npx remotion render \
            "MirrorChrome-Professional-1" \
            "out/mirror-chrome.mp4" \
            --codec=h264 \
            --crf=5 \
            --preset=fast \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Check file size
        run: |
          FILE_SIZE_MB=$(du -m "out/mirror-chrome.mp4" | cut -f1)
          echo "File size: ${FILE_SIZE_MB} MB"
          if [ "$FILE_SIZE_MB" -lt 100 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is below 100 MB target"
            exit 1
          elif [ "$FILE_SIZE_MB" -gt 250 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is above 250 MB target"
            exit 1
          else
            echo "OK: File size ${FILE_SIZE_MB} MB is within 100-250 MB range"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "mirror-chrome-video"
          path: "out/mirror-chrome.mp4"
          retention-days: 14
