name: Render Amazing Background Videos

on:
  push:
    branches: [main, master]
    paths:
      - "src/templates/hyperspace-rush/**"
      - "src/templates/prismatic-shatter/**"
      - "src/templates/cosmic-web/**"
      - "src/templates/neural-rain/**"
      - "src/templates/plasma-arc-field/**"
      - "src/templates/lissajous-resonance/**"
      - "src/templates/kinetic-gears/**"
      - "src/templates/spirograph-bloom/**"
      - "src/templates/hexagon-flow/**"
      - "src/templates/orbital-resonance/**"
      - "src/templates/ui/noise.ts"
      - "remotion.config.ts"
      - ".github/workflows/render-5-amazing.yml"
  workflow_dispatch:
    inputs:
      crf:
        description: "CRF (lower = larger file). Default 10 yields ~150-210 MB per 4K clip."
        required: false
        default: "10"
      codec:
        description: "Video codec"
        required: false
        default: "h264"

jobs:
  render:
    name: Render ${{ matrix.composition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composition:
          # first batch
          - "HyperspaceRush-Professional-1"
          - "PrismaticShatter-Professional-1"
          - "CosmicWeb-Professional-1"
          - "NeuralRain-Professional-1"
          - "PlasmaArcField-Professional-1"
          # second batch (new concepts)
          - "LissajousResonance-Professional-1"
          - "KineticGears-Professional-1"
          - "SpirographBloom-Professional-1"
          - "HexagonFlow-Professional-1"
          - "OrbitalResonance-Professional-1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Render ${{ matrix.composition }}
        run: |
          npx remotion render \
            "${{ matrix.composition }}" \
            "out/${{ matrix.composition }}.mp4" \
            --codec="${{ inputs.codec || 'h264' }}" \
            --crf=${{ inputs.crf || '10' }} \
            --preset=fast \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Report media info
        run: |
          echo "=== Media info for ${{ matrix.composition }} ==="
          FILE="out/${{ matrix.composition }}.mp4"
          if [ -f "$FILE" ]; then
            ls -la "$FILE"
            ffprobe -v error -show_entries format=duration,size,bit_rate -of default=noprint_wrappers=1 "$FILE"
          else
            echo "ERROR: Rendered file not found: $FILE"
            ls -la out/ 2>/dev/null || true
            exit 1
          fi

      - name: Check file size (target 100-250 MB)
        id: size
        run: |
          FILE="out/${{ matrix.composition }}.mp4"
          FILE_SIZE_BYTES=$(stat -c%s "$FILE")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          echo "file_size_mb=${FILE_SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "File: ${{ matrix.composition }}.mp4"
          echo "File size: ${FILE_SIZE_MB} MB"
          if [ "$FILE_SIZE_MB" -lt 100 ]; then
            echo "WARNING: File size ${FILE_SIZE_MB} MB is below 100 MB target (lower --crf for a larger file)."
          elif [ "$FILE_SIZE_MB" -gt 250 ]; then
            echo "WARNING: File size ${FILE_SIZE_MB} MB is above 250 MB target (raise --crf for a smaller file)."
          else
            echo "OK: File size ${FILE_SIZE_MB} MB is within 100-250 MB range."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.composition }}-video"
          path: "out/${{ matrix.composition }}.mp4"
          retention-days: 30
          if-no-files-found: warn
