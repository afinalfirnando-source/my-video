name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion Composition ID (e.g. AuroraBorealis-001)"
        required: true
        type: string
      props_json:
        description: "Props JSON string"
        required: true
        type: string
      job_id:
        description: "Unique job identifier (e.g. aurora_20260912_001)"
        required: true
        type: string
  push:
    paths:
      - ".github/workflows/render-remotion.yml"
      - "remotion.config.ts"
      - "src/shared/utils.ts"
      - "src/data/template-registry.ts"
      - "package.json"
      - "package-lock.json"

env:
  OUTPUT_NAME: render_${{ inputs.job_id }}.mp4

jobs:
  render:
    name: Render ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg + Python image deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip3 install Pillow numpy

      - name: Render full video (4K 60fps 900 frames)
        run: |
          npx remotion render "${{ inputs.composition_id }}" "$OUTPUT_NAME" \
            --props='${{ inputs.props_json }}' \
            --codec=h264 \
            --width=3840 \
            --height=2160 \
            --fps=60 \
            --bitrate=100M \
            --output-format=mp4

      - name: Report media info
        run: |
          echo "=== Media info for $OUTPUT_NAME ==="
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=nb_frames,width,height,codec_name -of default=noprint_wrappers=1 "$OUTPUT_NAME"

      - name: Check file size (5-250 MB)
        id: size
        run: |
          FILE_SIZE_BYTES=$(stat -c%s "$OUTPUT_NAME")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          echo "file_size_mb=${FILE_SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "File size: ${FILE_SIZE_MB} MB"
          if [ "$FILE_SIZE_MB" -lt 5 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is below 5 MB minimum"
            exit 1
          elif [ "$FILE_SIZE_MB" -gt 250 ]; then
            echo "ERROR: File size ${FILE_SIZE_MB} MB is above 250 MB maximum"
            exit 1
          else
            echo "OK: File size ${FILE_SIZE_MB} MB is within 5-250 MB range"
          fi

      - name: Quality gate — seamless loop check
        run: |
          ffmpeg -y -i "$OUTPUT_NAME" -vf "select=eq(n\,0)" -vframes 1 frame0.png
          ffmpeg -y -i "$OUTPUT_NAME" -vf "select=eq(n\,899)" -vframes 1 frame899.png
          python3 -c "
          import sys
          from PIL import Image
          import numpy as np
          img1 = np.array(Image.open('frame0.png').convert('RGB')).astype(np.float64)
          img2 = np.array(Image.open('frame899.png').convert('RGB')).astype(np.float64)
          if img1.shape != img2.shape:
            print(f'FAIL: Resolution mismatch {img1.shape} vs {img2.shape}')
            sys.exit(1)
          mse = float(np.mean((img1 - img2) ** 2))
          print(f'Seamless MSE (frame 0 vs 899): {mse:.6f}')
          if mse > 5.0:
            print(f'FAIL: MSE {mse:.6f} exceeds threshold 5.0')
            sys.exit(1)
          print('PASS: Seamless loop verified')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: render_${{ inputs.job_id }}
          path: ${{ env.OUTPUT_NAME }}
          retention-days: 7
