name: Render Anime Abstract Silk Neon

on: 
  workflow_dispatch:
  push:
    paths:
      - '.github/render_silk_neon.py'
      - '.github/workflows/render.yml'

env:
  RENDER_DIR: /tmp/renders
  OUTPUT_DIR: /tmp/output

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - start-frame: 1
            end-frame: 180
          - start-frame: 181
            end-frame: 360
          - start-frame: 361
            end-frame: 540
          - start-frame: 541
            end-frame: 720
          - start-frame: 721
            end-frame: 900
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          wget xz-utils ffmpeg xvfb libgl1-mesa-glx libglu1-mesa 2>&1 || true
        echo "Packages installed"

    - name: Download Blender
      run: |
        BLENDER_VERSION="5.0"
        echo "Trying Blender ${BLENDER_VERSION}..."
        URL="https://download.blender.org/release/Blender${BLENDER_VERSION}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
        if wget -q --spider "$URL" 2>/dev/null; then
          echo "Blender ${BLENDER_VERSION} available, downloading..."
          wget -q "$URL" -O blender.tar.xz
        else
          echo "Blender ${BLENDER_VERSION} not available, trying 4.2..."
          BLENDER_VERSION="4.2"
          URL="https://download.blender.org/release/Blender${BLENDER_VERSION}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          wget -q "$URL" -O blender.tar.xz
        fi
        tar -xJf blender.tar.xz
        echo "BLENDER_PATH=$(pwd)/$(ls -d blender-*/)" >> $GITHUB_ENV
        echo "Blender version:"
        "${{ env.BLENDER_PATH }}blender" --version

    - name: Setup directories
      run: |
        mkdir -p ${{ env.RENDER_DIR }}
        mkdir -p ${{ env.OUTPUT_DIR }}

    - name: Create render script with frame range
      run: |
        sed 's/scene.frame_start = 1/scene.frame_start = ${{ matrix.start-frame }}/' .github/render_silk_neon.py | \
          sed 's/scene.frame_end = 900/scene.frame_end = ${{ matrix.end-frame }}/' > render_frames.py
        echo "Frame range: ${{ matrix.start-frame }}-${{ matrix.end-frame }}"

    - name: Render frames
      run: |
        export DISPLAY=:0
        Xvfb :0 -screen 0 1024x768x24 &
        sleep 2
        
        echo "Render script contents:"
        cat render_frames.py | head -30
        
        "${{ env.BLENDER_PATH }}blender" \
          --background \
          --python render_frames.py 2>&1 | tee /tmp/blender_log.txt
        
        echo "=== Blender Log (last 50 lines) ==="
        tail -50 /tmp/blender_log.txt
        
        echo "Rendered frames:"
        ls -la ${{ env.RENDER_DIR }} | wc -l
        ls ${{ env.RENDER_DIR }} | head -5

    - name: Upload frames
      uses: actions/upload-artifact@v4
      with:
        name: frames-${{ matrix.start-frame }}-${{ matrix.end-frame }}
        path: ${{ env.RENDER_DIR }}/*.png
        retention-days: 7

  compile:
    needs: render
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Download all frames
      uses: actions/download-artifact@v4
      with:
        path: collected_frames/
        merge-multiple: true

    - name: Check frames collected
      run: |
        echo "Total files in collected_frames:"
        ls collected_frames/
        echo "Frame count:"
        ls collected_frames/*.png 2>/dev/null | wc -l

    - name: Compile video
      run: |
        mkdir -p output
        # List frames to verify naming
        ls collected_frames/ | head -5
        ls collected_frames/ | tail -5
        
        # Try compiling
        ffmpeg -y -framerate 60 \
          -i collected_frames/frame_%04d.png \
          -c:v libx264 \
          -crf 23 \
          -pix_fmt yuv420p \
          -vf "scale=1280:720" \
          output/AbstractSilkNeonWaves.mp4
        
        ls -la output/

    - name: Upload video
      uses: actions/upload-artifact@v4
      with:
        name: abstract-silk-neon-waves-full
        path: output/AbstractSilkNeonWaves.mp4
        retention-days: 30
        if-no-files-found: warn

    - name: Upload sample frames
      uses: actions/upload-artifact@v4
      with:
        name: sample-frames
        path: collected_frames/frame_00[01-99][0-9].png
        retention-days: 14