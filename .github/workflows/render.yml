name: Render Professional Video Series

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "remotion.config.ts"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID"
        required: false
        default: "CyberCityLoop-Professional-1"
      codec:
        description: "Video codec"
        required: true
        default: "h264"

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Determine composition from push
        id: detect
        run: |
          # Get the changed file from the push
          CHANGED_FILE=$(git diff --name-only HEAD~1 HEAD | grep "src/Root" | head -1)
          if [ -n "$CHANGED_FILE" ]; then
            # Extract composition name from filename
            COMPOSITION=$(basename "$CHANGED_FILE" .tsx | sed 's/Root-//')
            echo "composition=$COMPOSITION" >> $GITHUB_OUTPUT
          else
            echo "composition=${{ inputs.composition }}" >> $GITHUB_OUTPUT
          fi
          echo "codec=${{ inputs.codec }}" >> $GITHUB_OUTPUT

      - name: Render ${{ steps.detect.outputs.composition }}
        run: |
          npx remotion render \
            "${{ steps.detect.outputs.composition }}" \
            "out/${{ steps.detect.outputs.composition }}.mp4" \
            --codec="${{ steps.detect.outputs.codec }}" \
            --crf=18 \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.composition }}-${{ steps.detect.outputs.codec }}
          path: "out/${{ steps.detect.outputs.composition }}.mp4"
