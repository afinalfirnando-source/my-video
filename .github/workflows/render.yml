name: Render Professional Video Series

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "remotion.config.ts"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID"
        required: true
        default: "CyberCityLoop-Professional-1"
      codec:
        description: "Video codec"
        required: true
        default: "h264"

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Render ${{ inputs.composition }}
        run: |
          npx remotion render \
            "${{ inputs.composition }}" \
            "out/${{ inputs.composition }}.mp4" \
            --codec="${{ inputs.codec }}" \
            --crf=18 \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-${{ inputs.codec }}
          path: "out/${{ inputs.composition }}.mp4"
