name: Render Professional Video Series

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "remotion.config.ts"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID"
        required: false
        default: "CyberCityLoop-Professional-1"
      codec:
        description: "Video codec"
        required: true
        default: "h264"

jobs:
  render-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composition:
          - "CyberCityLoop-Professional-1"
          - "AuroraDreams-Professional-1"
          - "CosmicVoyage-Professional-1"
          - "OceanRealm-Professional-1"
          - "SolarTempest-Professional-1"
        codec: ["h264", "prores"]
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bundle
        run: npx remotion bundle

      - name: Render ${{ matrix.composition }}
        run: |
          npx remotion render \
            "${{ matrix.composition }}" \
            "out/${{ matrix.composition }}.mp4" \
            --codec="${{ matrix.codec }}" \
            --crf=18 \
            --width=3840 \
            --height=2160 \
            --fps=60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}-${{ matrix.codec }}
          path: "out/${{ matrix.composition }}.mp4"
